spring:
  application:
    name: ipqcmBiz
  #数据库配置
  datasource:
    # 基础配置
    url: jdbc:oracle:thin:@//localhost:1521/orcl
    username: C##IPQCM
    password: IPQCM_123
    driver-class-name: oracle.jdbc.OracleDriver
    #
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置连接超时时间
      connectTimeout: 30000
      # 配置网络超时时间
      socketTimeout: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  # 模板引擎
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML5
    cache: false # 开发时关闭缓存:ml-citation{ref="6,8" data="citationList"}
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  mvc:
    favicon:
      enabled: false
  data:
    redis:
      host: localhost
      database: 0
      password:
      port: 6379
# myBatis配置
mybatis:
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.th.iqpcmbiz.entity
  configuration:
    map-underscore-to-camel-case: true     # 开启驼峰命名映射
    default-fetch-size: 100                # 可选，调整批量查询性能
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 输出 SQL 日志

# 日志相关配置
logging:
  level:
    org.springframework: info
    org.springframework.web.servlet.mvc: debug
    org.apache.ibatis: DEBUG
    com.th.ipqcmbiz.mapper: DEBUG

# Swagger配置
springdoc:
  swagger-ui:
    enabled: true

# 分页插件配置
pagehelper:
  helper-dialect: oracle     # 指定数据库方言
  reasonable: true          # 页码溢出自动修正（如-1转为1）
  support-methods-arguments: true  # 支持接口参数传递分页
  params: count=countSql    # 优化COUNT查询性能
  auto-runtime-dialect: true  # 多数据源时自动识别方言

# 服务器配置
server:
  port: 3030
  forward-headers-strategy: native

# 认证配置
auth:
  token:
    # Token过期时间（分钟）
    expire-minutes: 30
    # 前端传递Token的Header名称
    header-name: X-Auth-Token

# 人脸识别配置
face:
  model:
    # 人脸检测模型路径
    detection: classpath:face_models/face_detection_yunet_2023mar.onnx
    # 人脸识别模型路径
    recognition: classpath:face_models/face_recognition_sface_2021dec.onnx
  enrollment:
    # 注册时采集的人脸图片数量
    face-count: 8
    # 人脸质量阈值，低于此值的人脸将被拒绝
    quality-threshold: 0.5
  recognition:
    # 人脸识别相似度阈值，低于此值认为是不同人
    threshold: 0.4

# 工具柜配置
tool:
  camera:
    # 摄像头设备编号，0表示第一个摄像头
    device-id: 0
  model:
    # 工具识别模型路径
    path: classpath:models/tool.onnx
  recognition:
    # 工具识别置信度阈值，低于此值的识别结果将被过滤
    confidence: 0.75
  yolo-server:
    # YOLO识别服务地址
    host: 127.0.0.1
    # YOLO识别服务端口
    port: 3031
    # 请求超时时间（毫秒）
    timeout: 5000
