<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>接线检测常用查询</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- 自定义配置 -->
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: '#165DFF',
                            success: '#00B42A',
                            warning: '#FF7D00',
                            danger: '#F53F3F',
                            gray: {
                                100: '#F2F3F5',
                                200: '#E5E6EB',
                                300: '#C9CDD4',
                                400: '#86909C',
                                500: '#4E5969',
                                600: '#272E3B',
                                700: '#1D2129',
                            }
                        },
                        fontFamily: {
                            inter: ['Inter', 'system-ui', 'sans-serif'],
                        },
                    }
                }
            }
        </script>
        
        <style type="text/tailwindcss">
            @layer utilities {
                .content-auto {
                    content-visibility: auto;
                }
                .shadow-card {
                    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                }
                .transition-all-300 {
                    transition: all 0.3s ease;
                }
                .table-hover-row:hover {
                    background-color: rgba(22, 93, 255, 0.05);
                }
            }
        </style>
    </head>
    <body class="font-inter bg-gray-100 min-h-screen">
        <!-- 主要内容区 -->
        <main class="container mx-auto px-4 py-8">
            <!-- 页面标题 -->
            <div class="mb-6">
                <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-gray-700 flex items-center">
                    <i class="fa fa-search-circle text-primary mr-2"></i>接线检测常用查询
                    <span class="ml-3 text-sm font-normal text-gray-500">查询和管理接线检测记录</span>
                </h2>
            </div>
            
            <!-- 查询条件卡片 -->
            <div class="bg-white rounded-xl shadow-card p-6 mb-6 transform hover:shadow-lg transition-all-300">
                <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center">
                    <i class="fa fa-filter text-primary mr-2"></i>查询条件
                </h3>
                <form id="searchForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="form-group">
                        <label for="queryTime" class="block text-sm font-medium text-gray-600 mb-1">时间范围</label>
                        <div class="relative">
                            <div class="flex items-center absolute inset-y-0 left-0 pl-3 pointer-events-none">
                                <i class="fa fa-calendar text-gray-400"></i>
                            </div>
                            <input type="date" id="queryTime" class="form-control pl-10 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all-300" placeholder="选择日期">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="deviceId" class="block text-sm font-medium text-gray-600 mb-1">设备编号</label>
                        <div class="relative">
                            <div class="flex items-center absolute inset-y-0 left-0 pl-3 pointer-events-none">
                                <i class="fa fa-barcode text-gray-400"></i>
                            </div>
                            <input type="text" id="deviceId" class="form-control pl-10 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all-300" placeholder="输入设备编号">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="inspectionStatus" class="block text-sm font-medium text-gray-600 mb-1">检测状态</label>
                        <div class="relative">
                            <div class="flex items-center absolute inset-y-0 left-0 pl-3 pointer-events-none">
                                <i class="fa fa-check-circle text-gray-400"></i>
                            </div>
                            <select id="inspectionStatus" class="form-control pl-10 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all-300 appearance-none bg-white">
                                <option value="">全部状态</option>
                                <option value="pass">通过</option>
                                <option value="fail">未通过</option>
                                <option value="pending">待检测</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                                <i class="fa fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="md:col-span-3 flex justify-end space-x-3 pt-2">
                        <button type="button" id="resetBtn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-all-300 flex items-center">
                            <i class="fa fa-refresh mr-2"></i>重置
                        </button>
                        <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-all-300 flex items-center shadow-md hover:shadow-lg">
                            <i class="fa fa-search mr-2"></i>查询
                        </button>
                    </div>
                </form>
            </div>
            
            <!-- 表格工具栏 -->
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-4 space-y-3 md:space-y-0">
                <div class="flex items-center space-x-3">
                    <button id="toggleColumnsBtn" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition-all-300 flex items-center">
                        <i class="fa fa-columns mr-1.5"></i>显示列
                    </button>
                    <button id="exportBtn" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition-all-300 flex items-center">
                        <i class="fa fa-download mr-1.5"></i>导出
                    </button>
                </div>
                <div class="relative">
                    <div class="flex items-center absolute inset-y-0 left-0 pl-3 pointer-events-none">
                        <i class="fa fa-search text-gray-400"></i>
                    </div>
                    <input type="text" id="tableSearch" class="form-control pl-10 py-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all-300" placeholder="搜索列表内容...">
                </div>
            </div>
            
            <!-- 列选择模态框 -->
            <div class="modal fade" id="columnSelectorModal" tabindex="-1" aria-labelledby="columnSelectorModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content rounded-xl">
                        <div class="modal-header bg-gray-50 rounded-t-xl">
                            <h5 class="modal-title font-semibold text-gray-700" id="columnSelectorModalLabel">选择显示列</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="space-y-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="deviceId" id="colDeviceId" checked>
                                    <label class="form-check-label text-gray-700" for="colDeviceId">
                                        设备编号
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="time" id="colTime" checked>
                                    <label class="form-check-label text-gray-700" for="colTime">
                                        时间
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="status" id="colStatus" checked>
                                    <label class="form-check-label text-gray-700" for="colStatus">
                                        检测状态
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="location" id="colLocation" checked>
                                    <label class="form-check-label text-gray-700" for="colLocation">
                                        安装位置
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="operator" id="colOperator" checked>
                                    <label class="form-check-label text-gray-700" for="colOperator">
                                        检测人员
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="type" id="colType" checked>
                                    <label class="form-check-label text-gray-700" for="colType">
                                        设备类型
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="voltage" id="colVoltage" checked>
                                    <label class="form-check-label text-gray-700" for="colVoltage">
                                        电压值(V)
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer bg-gray-50 rounded-b-xl">
                            <button type="button" class="px-4 py-1.5 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition-all-300" data-bs-dismiss="modal">取消</button>
                            <button type="button" id="saveColumnsBtn" class="px-4 py-1.5 bg-primary text-white rounded-lg text-sm hover:bg-primary/90 transition-all-300" data-bs-dismiss="modal">保存设置</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 表格内容 -->
            <div class="bg-white rounded-xl shadow-card overflow-hidden transform hover:shadow-lg transition-all-300">
                <div class="overflow-x-auto">
                    <table class="table table-hover mb-0">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">设备编号</th>
                                <th scope="col" class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">时间</th>
                                <th scope="col" class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">检测状态</th>
                                <th scope="col" class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">安装位置</th>
                                <th scope="col" class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">检测人员</th>
                                <th scope="col" class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">设备类型</th>
                                <th scope="col" class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">电压值(V)</th>
                                <th scope="col" class="py-3 px-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="inspectionTableBody">
                        <!-- 加载中状态 -->
                        <tr>
                            <td colspan="8" class="py-8 text-center">
                                <div class="inline-flex items-center">
                                    <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary"></div>
                                    <span class="ml-3 text-gray-500">正在加载数据...</span>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- 分页控件 -->
                <div class="px-4 py-3 flex items-center justify-between border-t border-gray-200 bg-white">
                    <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                        <div>
                            <p class="text-sm text-gray-700">
                                显示第 <span class="font-medium">1</span> 到 <span class="font-medium">10</span> 条，共 <span class="font-medium" th:text="${totalCount}">0</span> 条记录
                            </p>
                        </div>
                        <div>
                            <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                                <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                    <span class="sr-only">上一页</span>
                                    <i class="fa fa-chevron-left text-xs"></i>
                                </a>
                                <a href="#" class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50">
                                    1
                                </a>
                                <a href="#" class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50">
                                    <span class="sr-only">下一页</span>
                                    <i class="fa fa-chevron-right text-xs"></i>
                                </a>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- 视频查看模态框 -->
        <div class="modal fade" id="videoModal" tabindex="-1" aria-labelledby="videoModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content rounded-xl">
                    <div class="modal-header bg-gray-50 rounded-t-xl">
                        <h5 class="modal-title font-semibold text-gray-700" id="videoModalLabel">查看检测视频</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-0">
                        <div class="relative aspect-video bg-gray-900 rounded-b-xl">
                            <video id="inspectionVideo" class="w-full h-full object-contain" controls poster="https://picsum.photos/id/1015/800/450">
                                <source src="#" type="video/mp4">
                                您的浏览器不支持视频播放。
                            </video>
                        </div>
                    </div>
                    <div class="modal-footer bg-gray-50 rounded-b-xl">
                        <button type="button" class="px-4 py-1.5 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition-all-300" data-bs-dismiss="modal">关闭</button>
                    </div>
                </div>
            </div>
        </div>
        
        <script>
            // 状态映射
            const statusMap = {
                'pass': { text: '通过', class: 'text-success' },
                'fail': { text: '未通过', class: 'text-danger' },
                'pending': { text: '待检测', class: 'text-warning' }
            };

            // 初始化页面
            document.addEventListener('DOMContentLoaded', function() {
                // 加载数据
                loadData();

                // 添加事件监听
                document.getElementById('searchForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    loadData();
                });

                document.getElementById('resetBtn').addEventListener('click', function() {
                    document.getElementById('searchForm').reset();
                    loadData();
                });

                document.getElementById('saveColumnsBtn').addEventListener('click', function() {
                    // 保存列选择设置
                    saveColumnSettings();
                    // 重新加载数据以应用列设置
                    loadData();
                });

                document.getElementById('tableSearch').addEventListener('input', function() {
                    // 即时搜索表格内容
                    searchTable(this.value);
                });

                document.getElementById('exportBtn').addEventListener('click', function() {
                    exportData();
                });
            });

            // 加载数据
            function loadData() {
                // 显示加载状态
                document.getElementById('inspectionTableBody').innerHTML = `
                <tr>
                    <td colspan="8" class="py-8 text-center">
                        <div class="inline-flex items-center">
                            <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary"></div>
                            <span class="ml-3 text-gray-500">正在加载数据...</span>
                        </div>
                    </td>
                </tr>
            `;

                // 获取查询参数
                const queryParams = {
                    time: document.getElementById('queryTime').value,
                    deviceId: document.getElementById('deviceId').value,
                    status: document.getElementById('inspectionStatus').value,
                    page: 1,
                    pageSize: 10
                };

                // 实际应用中这里应该是真实的API调用
                // 由于是Thymeleaf页面，可能会直接渲染数据或通过AJAX调用
                // 这里模拟一个延迟加载效果
                setTimeout(() => {
                    // 从Thymeleaf变量中获取数据（如果有）
                    // 或者通过AJAX请求数据
                    renderTable([]);
                }, 800);
            }

            // 渲染表格
            function renderTable(data) {
                const tableBody = document.getElementById('inspectionTableBody');
                tableBody.innerHTML = '';
                if (data && data.length > 0) {
                    data.forEach(item => {
                        const statusInfo = statusMap[item.status];
                        const row = document.createElement('tr');
                        row.className = 'table-hover-row transition-all-300';
                        row.innerHTML = `
                        <td class="py-3 px-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">${item.deviceId}</div>
                        </td>
                        <td class="py-3 px-4 whitespace-nowrap">
                            <div class="text-sm text-gray-700">${item.time}</div>
                        </td>
                        <td class="py-3 px-4 whitespace-nowrap">
                            <div class="text-sm font-medium ${statusInfo.class}">
                                ${item.status === 'pass' ? '<i class="fa fa-check-circle mr-1"></i>' : item.status === 'fail' ? '<i class="fa fa-times-circle mr-1"></i>' : '<i class="fa fa-clock-o mr-1"></i>'}${statusInfo.text}
                            </div>
                        </td>
                        <td class="py-3 px-4 whitespace-nowrap">
                            <div class="text-sm text-gray-700">${item.location}</div>
                        </td>
                        <td class="py-3 px-4 whitespace-nowrap">
                            <div class="text-sm text-gray-700">${item.operator}</div>
                        </td>
                        <td class="py-3 px-4 whitespace-nowrap">
                            <div class="text-sm text-gray-700">${item.type}</div>
                        </td>
                        <td class="py-3 px-4 whitespace-nowrap">
                            <div class="text-sm text-gray-700">${item.voltage}</div>
                        </td>
                        <td class="py-3 px-4 whitespace-nowrap text-sm font-medium">
                            <button type="button" class="view-video-btn text-primary hover:text-primary/80 transition-all-300 px-2 py-1 rounded border border-primary/30 hover:bg-primary/5" data-id="${item.id}">
                                <i class="fa fa-play-circle mr-1"></i>查看视频
                            </button>
                        </td>
                    `;
                        tableBody.appendChild(row);
                    });

                    // 添加查看视频按钮事件
                    document.querySelectorAll('.view-video-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const id = parseInt(this.getAttribute('data-id'));
                            showVideoModal(id);
                        });
                    });
                } else {
                    // 无数据状态
                    tableBody.innerHTML = `
                    <tr>
                        <td colspan="8" class="py-8 text-center">
                            <div class="flex flex-col items-center">
                                <i class="fa fa-search text-gray-300 text-4xl mb-3"></i>
                                <p class="text-gray-500">未找到匹配的数据</p>
                                <p class="text-gray-400 text-sm mt-1">请尝试调整查询条件</p>
                            </div>
                        </td>
                    </tr>
                `;
                }
            }

            // 显示视频模态框
            function showVideoModal(id) {
                // 实际应用中这里应该根据ID获取对应的视频URL
                const videoUrl = `https://example.com/videos/inspection-${id}.mp4`;

                // 设置视频源
                document.getElementById('inspectionVideo').src = videoUrl;

                // 显示模态框
                const videoModal = new bootstrap.Modal(document.getElementById('videoModal'));
                videoModal.show();
            }

            // 保存列选择设置
            function saveColumnSettings() {
                const columnSettings = {
                    deviceId: document.getElementById('colDeviceId').checked,
                    time: document.getElementById('colTime').checked,
                    status: document.getElementById('colStatus').checked,
                    location: document.getElementById('colLocation').checked,
                    operator: document.getElementById('colOperator').checked,
                    type: document.getElementById('colType').checked,
                    voltage: document.getElementById('colVoltage').checked
                };

                // 保存到本地存储
                localStorage.setItem('inspectionTableColumns', JSON.stringify(columnSettings));

                // 通知用户
                alert('列设置已保存');
            }

            // 搜索表格内容
            function searchTable(keyword) {
                keyword = keyword.toLowerCase();
                const rows = document.querySelectorAll('#inspectionTableBody tr');

                rows.forEach(row => {
                    if (keyword === '') {
                        row.classList.remove('hidden');
                        return;
                    }

                    const rowText = row.textContent.toLowerCase();
                    if (rowText.includes(keyword)) {
                        row.classList.remove('hidden');
                    } else {
                        row.classList.add('hidden');
                    }
                });
            }

            // 导出数据
            function exportData() {
                // 获取当前查询参数
                const queryParams = {
                    time: document.getElementById('queryTime').value,
                    deviceId: document.getElementById('deviceId').value,
                    status: document.getElementById('inspectionStatus').value
                };

                // 实际应用中应该调用导出API
                alert(`导出功能已触发，实际应用中会导出符合以下条件的数据：\n${JSON.stringify(queryParams, null, 2)}`);
            }
        </script>
    </body>
</html>
