<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>智能工具柜 - 工具管理</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="css/admin_tool.css">
</head>
<body>
<div class="header">
  <div class="logo">智能工具柜管理系统</div>
  <div class="user-info">
    <a href="admin_index.html" class="btn btn-default">返回控制台</a>
     <a class="btn btn-danger" href="javascript:void(0)" onclick="logout()">退出登录</a>
     <span>当前登录：管理员（admin）</span>
  </div>
</div>

<div class="card">
  <h2>工具管理</h2>
  <div style="display: flex; gap: 10px; margin-top: 10px; align-items: center;">
    <button class="btn btn-primary" onclick="openAddToolModal()">上架新工具</button>
    <input type="text" class="form-control" id="searchKeyword" placeholder="按工具名称/编号搜索" style="flex: 1;">
    <button class="btn btn-primary" onclick="searchTool()">查询</button>
  </div>
</div>

<div class="card">
  <table class="table">
    <thead>
    <tr>
      <th>工具名称</th>
      <th>工具编号</th>
      <th>存放位置</th>
      <th>工具类型</th>
      <th>状态</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody id="toolTableBody"></tbody>
  </table>
</div>

<div class="modal" id="addToolModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>上架新工具</h3>
      <span class="modal-close" onclick="closeAddToolModal()">&times;</span>
    </div>
    <div class="form-group">
      <label>工具名称</label>
      <input type="text" id="toolName" class="form-control" placeholder="请输入工具名称">
    </div>
    <div class="form-group">
      <label>工具编号</label>
      <input type="text" id="toolCode" class="form-control" placeholder="请输入工具编号（如W001）">
    </div>
    <div class="form-group">
      <label>存放位置</label>
      <select id="cabinetNo" class="form-control">
        <option value="A01">A01柜</option>
        <option value="A02">A02柜</option>
        <option value="B01">B01柜</option>
        <option value="B02">B02柜</option>
      </select>
    </div>
    <div class="form-group">
      <label>工具类型</label>
      <select id="toolType" class="form-control">
        <option value="hand">手动工具</option>
        <option value="electric">电动工具</option>
        <option value="measuring">测量工具</option>
      </select>
    </div>
    <div class="form-group" id="imageGroup">
      <label>工具图片</label>
      <div style="display: flex; align-items: center; gap: 10px;">
        <input type="file" id="toolImage" accept="image/*" style="display: none;" onchange="handleImageSelect(this)">
        <button type="button" class="btn btn-default" onclick="document.getElementById('toolImage').click()">选择图片</button>
        <span id="imageName" style="color: #666; font-size: 12px;"></span>
      </div>
      <div id="imagePreview" style="margin-top: 10px; display: none;">
        <img id="previewImg" style="max-width: 200px; max-height: 150px; border: 1px solid #ddd; border-radius: 4px;">
        <button type="button" class="btn btn-danger btn-sm" onclick="removeImage()" style="margin-top: 5px;">删除图片</button>
      </div>
    </div>
    <div class="form-group" id="statusGroup" style="display:none;">
      <label>状态</label>
      <select id="toolStatus" class="form-control">
        <option value="AVAILABLE">可借</option>
        <option value="BORROWED">已借出</option>
        <option value="MAINTENANCE">维护中</option>
      </select>
    </div>
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button class="btn btn-default" onclick="closeAddToolModal()">取消</button>
      <button class="btn btn-success" onclick="saveTool()">保存</button>
    </div>
  </div>
</div>
<script src="../js/constants.js"></script>
<script src="../js/auth.js"></script>
<script src="js/admin_tool.js"></script>
<script>
if (!initPageAuth(SESSION_TIMEOUT)) {
    // Already redirected to login
} else {
    const userInfo = getUserInfo();
    if (userInfo) {
        const spanEl = document.querySelector('.user-info span');
        if (spanEl) {
            spanEl.textContent = '当前登录：' + (userInfo.userName || '未知') + '（' + (userInfo.userId || '') + '）';
        }
    }
}
</script>
</body>
</html>
