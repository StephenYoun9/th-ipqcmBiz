<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>智能工具柜 - 工具管理</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<!-- 顶部导航 -->
<div class="header">
  <div class="logo">智能工具柜管理系统</div>
  <div class="user-info">
    <a href="admin_index.html" class="btn btn-default">返回控制台</a>
    <span>当前登录：管理员（admin）</span>
  </div>
</div>

<!-- 操作工具栏 -->
<div class="card">
  <h2>工具管理</h2>
  <div style="display: flex; gap: 10px; margin-top: 10px; align-items: center;">
    <button class="btn btn-primary" onclick="openAddToolModal()">上架新工具</button>
    <div class="form-group" style="flex: 1;">
      <input type="text" class="form-control" placeholder="按工具名称/编号搜索">
    </div>
    <button class="btn btn-primary">查询</button>
  </div>
</div>

<!-- 工具列表 -->
<div class="card">
  <table class="table">
    <thead>
    <tr>
      <th>工具名称</th>
      <th>工具编号</th>
      <th>存放位置</th>
      <th>工具类型</th>
      <th>状态</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr>
      <td>扳手</td>
      <td>W001</td>
      <td>A01柜</td>
      <td>手动工具</td>
      <td>可借</td>
      <td>
        <button class="btn btn-default btn-sm">编辑</button>
        <button class="btn btn-danger btn-sm">下架</button>
        <button class="btn btn-warning btn-sm">维护</button>
      </td>
    </tr>
    <tr>
      <td>螺丝刀</td>
      <td>S002</td>
      <td>A02柜</td>
      <td>手动工具</td>
      <td>可借</td>
      <td>
        <button class="btn btn-default btn-sm">编辑</button>
        <button class="btn btn-danger btn-sm">下架</button>
        <button class="btn btn-warning btn-sm">维护</button>
      </td>
    </tr>
    <tr>
      <td>电钻</td>
      <td>D004</td>
      <td>B01柜</td>
      <td>电动工具</td>
      <td>维护中</td>
      <td>
        <button class="btn btn-default btn-sm">编辑</button>
        <button class="btn btn-danger btn-sm">下架</button>
        <button class="btn btn-success btn-sm">完成维护</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<!-- 上架工具弹窗 -->
<div class="modal" id="addToolModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>上架新工具</h3>
      <span class="modal-close" onclick="closeAddToolModal()">&times;</span>
    </div>
    <div class="form-group">
      <label>工具影像采集</label>
      <div style="width: 100%; height: 200px; background-color: #f5f5f5; border: 1px dashed #ddd; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
        <span>摄像头实时画面区域</span>
      </div>
      <button class="btn btn-primary">采集工具影像</button>
      <button class="btn btn-default" style="margin-left: 10px;">提取工具特征</button>
    </div>
    <div class="form-group">
      <label>工具名称</label>
      <input type="text" class="form-control" placeholder="请输入工具名称">
    </div>
    <div class="form-group">
      <label>工具编号</label>
      <input type="text" class="form-control" placeholder="请输入工具编号（如W001）">
    </div>
    <div class="form-group">
      <label>存放位置</label>
      <select class="form-control">
        <option value="A01">A01柜</option>
        <option value="A02">A02柜</option>
        <option value="B01">B01柜</option>
        <option value="B02">B02柜</option>
      </select>
    </div>
    <div class="form-group">
      <label>工具类型</label>
      <select class="form-control">
        <option value="hand">手动工具</option>
        <option value="electric">电动工具</option>
        <option value="measuring">测量工具</option>
      </select>
    </div>
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button class="btn btn-default" onclick="closeAddToolModal()">取消</button>
      <button class="btn btn-success">保存并上架</button>
    </div>
  </div>
</div>

<script>
  // 打开上架工具弹窗
  function openAddToolModal() {
    document.getElementById('addToolModal').style.display = 'flex';
  }
  // 关闭上架工具弹窗
  function closeAddToolModal() {
    document.getElementById('addToolModal').style.display = 'none';
  }
</script>
</body>
</html>
