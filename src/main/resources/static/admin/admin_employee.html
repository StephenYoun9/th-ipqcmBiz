<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能工具柜 - 员工管理</title>
    <link href="../css/common.css" rel="stylesheet">
</head>
<body>
<div class="header">
    <div class="logo">智能工具柜管理系统</div>
    <div class="user-info">
        <a class="btn btn-default" href="admin_index.html">返回控制台</a>
        <a class="btn btn-danger" href="javascript:void(0)" onclick="logout()">退出登录</a>
    </div>
</div>

<div class="card">
    <h2>员工管理</h2>
    <div style="display: flex; gap: 10px; margin-top: 10px; align-items: center;">
        <button class="btn btn-primary" onclick="openAddEmployeePage()">新增员工</button>
        <button class="btn btn-default">批量导入</button>
        <div style="flex: 1; display: flex; align-items: center;">
            <input class="form-control" id="searchInput" placeholder="按工号/姓名搜索" type="text" style="height: 38px;">
        </div>
        <button class="btn btn-primary" onclick="loadEmployeeList()">查询</button>
    </div>
</div>

<div class="card">
    <table class="table">
        <thead>
            <tr>
                <th>姓名</th>
                <th>工号</th>
                <th>权限</th>
                <th>状态</th>
                <th>人脸录入状态</th>
                <th>指纹录入状态</th>
                <th>操作</th>
            </tr>
        </thead>
         <tbody id="employeeTableBody">
            <tr><td colspan="7" style="text-align: center;">加载中...</td></tr>
        </tbody>
    </table>
    <div id="paginationContainer" style="margin-top: 15px; text-align: center;"></div>
</div>

<!-- 编辑员工弹窗 -->
<div class="modal" id="editModal">
    <div class="modal-content" style="min-width: 450px;">
        <div class="modal-header">
            <h3>编辑员工</h3>
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
        </div>
        <div style="padding: 10px 0;">
            <input type="hidden" id="editUserId">
            <div class="form-group">
                <label>姓名</label>
                <input class="form-control" id="editUserName" type="text">
            </div>
            <div class="form-group">
                <label>工号</label>
                <input class="form-control" id="editUserIdDisplay" type="text" disabled>
            </div>
            <div class="form-group">
                <label>新密码（留空则不修改）</label>
                <input class="form-control" id="editPassword" type="password" placeholder="请输入新密码">
            </div>
            <div class="form-group">
                <label>权限</label>
                <select class="form-control" id="editUserRole">
                    <option value="1">普通员工</option>
                    <option value="0">管理员</option>
                </select>
            </div>
            <div class="form-group">
                <label>状态</label>
                <select class="form-control" id="editStatus">
                    <option value="1">正常</option>
                    <option value="0">禁用</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                <button class="btn btn-default" onclick="closeEditModal()">取消</button>
                <button class="btn btn-primary" onclick="saveEditEmployee()">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="../js/constants.js"></script>
<script src="../js/auth.js"></script>
<script src="js/admin_employee.js"></script>
<script>
if (!initPageAuth(SESSION_TIMEOUT)) {
    // Already redirected to login
} else {
    const userInfo = getUserInfo();
    if (userInfo) {
        const spanEl = document.querySelector('.user-info span');
        if (spanEl) {
            spanEl.textContent = '当前登录：' + (userInfo.userName || '未知') + '（' + (userInfo.userId || '') + '）';
        }
    }
}
</script>
</body>
</html>
