<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>智能工具柜 - 管理员控制台</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* 控制台卡片样式 */
    .dashboard-card {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .stat-card {
      flex: 1;
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .stat-num {
      font-size: 32px;
      font-weight: bold;
      color: #3498db;
      margin: 10px 0;
    }
    .stat-desc {
      color: #666;
    }
    .func-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .func-item {
      background-color: white;
      border-radius: 8px;
      padding: 30px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .func-item:hover {
      transform: translateY(-5px);
    }
    .func-icon {
      font-size: 36px;
      color: #3498db;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
<!-- 顶部导航 -->
<div class="header">
  <div class="logo">智能工具柜管理系统</div>
  <div class="user-info">
    <span>管理员控制台</span>
    <a href="../index.html" class="btn btn-default">退出登录</a>
  </div>
</div>

<!-- 数据概览 -->
<div class="card">
  <h2>数据概览</h2>
  <div class="dashboard-card">
    <div class="stat-card">
      <div class="stat-num">58</div>
      <div class="stat-desc">在册员工数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">126</div>
      <div class="stat-desc">工具总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">23</div>
      <div class="stat-desc">今日借还次数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color: #e74c3c;">2</div>
      <div class="stat-desc">未处理异常日志</div>
    </div>
  </div>
</div>

<!-- 功能入口 -->
<div class="card">
  <h2>功能管理</h2>
  <div class="func-card">
    <div class="func-item" onclick="window.location.href='admin_employee.html'">
      <div class="func-icon">👥</div>
      <h3>员工管理</h3>
      <p>新增/编辑/删除员工，录入生物特征</p>
    </div>
    <div class="func-item" onclick="window.location.href='admin_tool.html'">
      <div class="func-icon">🔧</div>
      <h3>工具管理</h3>
      <p>工具上架/下架/维护，更新工具信息</p>
    </div>
    <div class="func-item" onclick="window.location.href='admin_log.html'">
      <div class="func-icon">📜</div>
      <h3>日志审计</h3>
      <p>查询操作日志，处理异常告警</p>
    </div>
  </div>
</div>

<!-- 系统告警 -->
<div class="card">
  <h2>系统告警</h2>
  <div class="alert alert-danger">
    <strong>紧急告警：</strong>B01柜电钻（D004）维护超期，请及时处理！
  </div>
  <div class="alert alert-warning">
    <strong>提醒：</strong>有2名员工生物特征即将过期，请及时更新！
  </div>
</div>
</body>
</html>
