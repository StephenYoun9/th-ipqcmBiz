<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>智能工具柜 - 管理员控制台</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="css/admin_index.css">
</head>
<body>
<div class="header">
  <div class="logo">智能工具柜管理系统</div>
  <div class="user-info">
    <span>管理员控制台</span>
    <a href="javascript:void(0)" class="btn btn-danger" onclick="logout()">退出登录</a>
  </div>
</div>

<div class="card">
  <h2>数据概览</h2>
  <div class="dashboard-card">
    <div class="stat-card">
      <div class="stat-num" id="employeeCount">-</div>
      <div class="stat-desc">在册员工数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="toolCount">-</div>
      <div class="stat-desc">工具总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="todayBorrowCount">-</div>
      <div class="stat-desc">今日借还次数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="pendingExceptionCount" style="color: #e74c3c;">-</div>
      <div class="stat-desc">未处理异常日志</div>
    </div>
  </div>
</div>

<div class="card">
  <h2>功能管理</h2>
  <div class="func-card">
    <div class="func-item" onclick="window.location.href='admin_employee.html'">
      <div class="func-icon">&#128101;</div>
      <h3>员工管理</h3>
      <p>新增/编辑/删除员工，录入生物特征</p>
    </div>
    <div class="func-item" onclick="window.location.href='admin_tool.html'">
      <div class="func-icon">&#128295;</div>
      <h3>工具管理</h3>
      <p>工具上架/下架/维护，更新工具信息</p>
    </div>
    <div class="func-item" onclick="window.location.href='admin_log.html'">
      <div class="func-icon">&#128203;</div>
      <h3>日志审计</h3>
      <p>查询操作日志，处理异常告警</p>
    </div>
  </div>
</div>

<div class="card">
  <h2>系统公告</h2>
  <div style="margin-bottom: 15px;">
    <button class="btn btn-primary" onclick="openAnnouncementModal(null, '', '', 'info')">发布公告</button>
  </div>
  <div id="announcementList"></div>
</div>

<div class="card">
  <h2>系统告警</h2>
  <div id="alertsContainer">
    <div class="alert alert-info">加载中...</div>
  </div>
</div>

<!-- 图片预览弹窗 -->
<div class="modal" id="imagePreviewModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); cursor: pointer;" onclick="closeImagePreview()">
  <span style="position: absolute; right: 20px; top: 10px; color: white; font-size: 40px; cursor: pointer;">&times;</span>
  <img id="previewImage" style="max-width: 90%; max-height: 90%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
</div>

<!-- 发布公告弹窗 -->
<div class="modal" id="announcementModal">
  <div class="modal-content" style="max-width: 600px;">
    <div class="modal-header">
      <h3 id="announcementModalTitle">发布系统公告</h3>
      <span class="modal-close" onclick="closeAnnouncementModal()">&times;</span>
    </div>
    <div class="form-group">
      <label>公告标题 <span style="color: #999;">(最多256字)</span></label>
      <input type="text" id="announcementTitle" class="form-control" placeholder="请输入公告标题" maxlength="256">
      <small id="titleCount" style="color: #666;">0/256</small>
    </div>
    <div class="form-group">
      <label>公告内容 <span style="color: #999;">(最多2048字)</span></label>
      <textarea id="announcementContent" class="form-control" rows="5" placeholder="请输入公告内容" maxlength="2048"></textarea>
      <small id="contentCount" style="color: #666;">0/2048</small>
    </div>
    <div class="form-group">
      <label>公告类型</label>
      <select id="announcementType" class="form-control">
        <option value="info">通知</option>
        <option value="warning">警告</option>
        <option value="danger">危险</option>
      </select>
    </div>
    <div class="form-group">
      <label>附件（图片/视频，可多选）</label>
      <input type="file" id="announcementAttachments" accept="image/*,video/*" multiple style="display: none;" onchange="handleAttachmentSelect(this)">
      <button type="button" class="btn btn-default" onclick="document.getElementById('announcementAttachments').click()">选择文件</button>
      <span id="attachmentInfo" style="color: #666; margin-left: 10px;"></span>
    </div>
    <div id="attachmentPreview" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px;"></div>
    <div class="form-group" style="margin-top: 15px;">
      <label>失效时间（可选，留空则永久有效）</label>
      <input type="datetime-local" id="announcementExpireTime" class="form-control">
    </div>
    <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
      <button class="btn btn-default" onclick="closeAnnouncementModal()">取消</button>
      <button class="btn btn-success" id="publishBtn" onclick="publishAnnouncement()">发布</button>
    </div>
  </div>
</div>
<script src="../js/constants.js"></script>
<script src="../js/auth.js"></script>
<script src="js/admin_index.js"></script>
<script>
if (!initPageAuth(SESSION_TIMEOUT)) {
    // Already redirected to login
} else {
    const userInfo = getUserInfo();
    if (userInfo) {
        const spanEl = document.querySelector('.user-info span');
        if (spanEl) {
            spanEl.textContent = '当前登录：' + (userInfo.userName || '未知') + '（' + (userInfo.userId || '') + '）';
        }
    }
}
</script>
</body>
</html>
