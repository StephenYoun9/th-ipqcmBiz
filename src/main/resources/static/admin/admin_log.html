<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>智能工具柜 - 日志审计</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="css/admin_log.css">
</head>
<body>
<div class="header">
  <div class="logo">智能工具柜管理系统</div>
  <div class="user-info">
    <a href="admin_index.html" class="btn btn-default">返回控制台</a>
     <a class="btn btn-danger" href="javascript:void(0)" onclick="logout()">退出登录</a>
     <span>当前登录：管理员（admin）</span>
  </div>
</div>

<div class="card">
  <h2>日志审计</h2>
  <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;">
    <div class="form-group" style="width: 200px;">
      <label>操作人</label>
      <input type="text" id="operatorKeyword" class="form-control" placeholder="工号/姓名">
    </div>
    <div class="form-group" style="width: 200px;">
      <label>开始时间</label>
      <input type="date" id="startTime" class="form-control">
    </div>
    <div class="form-group" style="width: 200px;">
      <label>结束时间</label>
      <input type="date" id="endTime" class="form-control">
    </div>
    <div class="form-group" style="width: 200px;">
      <label>操作类型</label>
      <select id="operatorType" class="form-control">
        <option value="">全部</option>
        <option value="borrow">借工具</option>
        <option value="return">还工具</option>
        <option value="employee">员工管理</option>
        <option value="tool">工具管理</option>
      </select>
    </div>
    <div class="form-group" style="display: flex; align-items: flex-end;">
      <label style="margin-right: 5px;">仅看异常</label>
      <input type="checkbox" id="exceptionOnly">
    </div>
    <button class="btn btn-primary" style="height: 38px; margin-top: 24px;" onclick="queryLogs()">查询</button>
    <button class="btn btn-default" style="height: 38px; margin-top: 24px;" onclick="exportLogs()">导出日志</button>
  </div>
</div>

<div class="card">
  <table class="table">
    <thead>
    <tr>
      <th>操作人</th>
      <th>操作时间</th>
      <th>操作类型</th>
      <th>操作详情</th>
      <th>异常标记</th>
    </tr>
    </thead>
    <tbody id="logTableBody">
    </tbody>
  </table>
  <div style="margin-top: 15px; display: flex; justify-content: center; gap: 10px;">
    <button class="btn btn-default" id="prevBtn" onclick="prevPage()">上一页</button>
    <span id="pageInfo">第1页 / 共1页</span>
    <button class="btn btn-default" id="nextBtn" onclick="nextPage()">下一页</button>
  </div>
</div>

<div class="card" id="exceptionAlert" style="display: none;">
  <div class="alert alert-danger">
    发现异常日志，请及时核查！
  </div>
</div>
<script src="../js/constants.js"></script>
<script src="../js/auth.js"></script>
<script src="js/admin_log.js"></script>
<script>
if (!initPageAuth(SESSION_TIMEOUT)) {
    // Already redirected to login
} else {
    const userInfo = getUserInfo();
    if (userInfo) {
        const spanEl = document.querySelector('.user-info span');
        if (spanEl) {
            spanEl.textContent = '当前登录：' + (userInfo.userName || '未知') + '（' + (userInfo.userId || '') + '）';
        }
    }
}
</script>
</body>
</html>
