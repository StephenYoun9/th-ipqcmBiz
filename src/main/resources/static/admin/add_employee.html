<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能工具柜 - 新增员工</title>
    <link href="../css/common.css" rel="stylesheet">
    <link href="css/add_employee.css" rel="stylesheet">
</head>
<body>
<div class="add-employee-container">
    <h2 style="margin-bottom: 20px;">新增员工</h2>

    <div class="form-group">
        <label>姓名</label>
        <input class="form-control" id="empName" placeholder="请输入员工姓名" type="text">
    </div>

    <div class="form-group">
        <label>工号</label>
        <input class="form-control" id="empNo" placeholder="请输入员工工号" type="text">
    </div>

    <div class="form-group">
        <label>登录密码</label>
        <input class="form-control" id="password" placeholder="请输入登录密码" type="password">
    </div>

    <div class="form-group">
        <label>权限</label>
        <select class="form-control" id="empRole">
            <option value="1">普通员工</option>
            <option value="0">管理员</option>
        </select>
    </div>

    <div class="form-group">
        <label>生物特征录入</label>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn btn-primary" onclick="gotoFaceRegister()">录入人脸</button>
            <span class="status-warning" id="faceStatus">未录入</span>
            <span class="status-success" id="faceSuccess">已录入</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-default" onclick="closePage()">取消</button>
        <button class="btn btn-success" onclick="saveEmployee()">保存</button>
    </div>
</div>
<script src="../js/constants.js"></script>
<script src="../js/auth.js"></script>
<script src="js/add_employee.js"></script>
<script>
if (!initPageAuth(SESSION_TIMEOUT)) {
    // Already redirected to login
}
</script>
</body>
</html>
