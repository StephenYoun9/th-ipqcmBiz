<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能工具柜 - 人脸采集</title>
    <link href="../css/common.css" rel="stylesheet">
    <link href="css/register_face.css" rel="stylesheet">
</head>
<body>
<div class="header">
    <div class="logo">智能工具柜管理系统</div>
    <div class="user-info">
        <span id="loginUser">当前登录：管理员（admin）</span>
        <a class="btn btn-danger" href="javascript:void(0)" onclick="logout()">退出登录</a>
    </div>
</div>

<div class="card face-collect-container">
    <h2>多方向人脸采集</h2>

    <div class="input-box">
        <input disabled="disabled" id="userName" placeholder="请输入姓名" type="text"/>
        <input disabled="disabled" hidden="hidden" id="userId" type="text"/>
        <button class="btn btn-primary" id="start-btn" onclick="startCollect()">开始采集</button>
        <button class="btn btn-danger" id="complete-btn" onclick="completeCollect()" disabled>完成采集</button>
        <button class="btn btn-default" onclick="backToPage()">返回</button>
    </div>

    <div class="status-box info" id="status-box">状态：等待开始</div>

    <div class="video-box">
        <div class="video-wrapper" style="position: relative;">
            <canvas id="mainCanvas" width="640" height="480" style="background:#eee; border-radius: 4px;"></canvas>
            <div id="maskLayer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; border-radius: 4px;"></div>
            <div id="qualityBar" style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 200px; height: 20px; background: rgba(0,0,0,0.6); border-radius: 10px; overflow: hidden; opacity: 0; transition: opacity 0.3s;">
                <div id="qualityFill" style="height: 100%; background: linear-gradient(90deg, #f44336, #ff9800, #4caf50); width: 0%; transition: width 0.3s;"></div>
                <span id="qualityText" style="position: absolute; width: 100%; text-align: center; color: white; font-size: 12px; line-height: 20px;">0%</span>
            </div>
        </div>
        <canvas id="captureCanvas" style="display:none;"></canvas>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%;">0%</div>
    </div>
    <div class="progress-text" id="progress-text">已采集 0/8 张</div>

    <div class="face-preview" id="face-preview">
        <div class="face-thumb" id="thumb-1">?</div>
        <div class="face-thumb" id="thumb-2">?</div>
        <div class="face-thumb" id="thumb-3">?</div>
        <div class="face-thumb" id="thumb-4">?</div>
        <div class="face-thumb" id="thumb-5">?</div>
        <div class="face-thumb" id="thumb-6">?</div>
        <div class="face-thumb" id="thumb-7">?</div>
        <div class="face-thumb" id="thumb-8">?</div>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" id="capture-btn" onclick="captureFace()" disabled>拍照采集</button>
    </div>
</div>
<script src="../js/constants.js"></script>
<script src="../js/auth.js"></script>
<script src="js/register_face.js"></script>
<script>
if (!initPageAuth(SESSION_TIMEOUT)) {
    // Already redirected to login
}
</script>
</body>
</html>
