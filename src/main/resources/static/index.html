<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <title>智能工具柜 - 登录</title>
        <style>
            /* 保留原有样式，新增摄像头相关样式 */
            .login-container {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background-color: #f5f7fa;
                padding: 20px;
            }

            .login-card {
                width: 450px;
                background-color: white;
                border-radius: 8px;
                padding: 40px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            }

            .login-title {
                text-align: center;
                font-size: 24px;
                margin-bottom: 30px;
                color: #2c3e50;
            }

            .auth-type {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
                border-bottom: 1px solid #ddd;
                padding-bottom: 10px;
            }

            .auth-type button {
                flex: 1;
                padding: 10px;
                border: none;
                background-color: #f8f9fa;
                border-radius: 4px;
                cursor: pointer;
            }

            .auth-type button.active {
                background-color: #3498db;
                color: white;
            }

            /* 新增摄像头样式 */
            #video-container {
                position: relative;
                width: 300px;
                height: 200px;
                margin: 0 auto 20px;
            }

            #video {
                width: 100%;
                height: 100%;
                background-color: #f8f9fa;
                border: 2px dashed #ddd;
            }

            #canvas {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <div class="login-card">
                <div class="login-title">智能工具柜管理系统</div>
                
                <!-- 认证方式选择 -->
                <div class="auth-type">
                    <button class="active" id="pwdAuth">账号密码</button>
                    <button id="fingerAuth">指纹认证</button>
                    <button id="faceAuth">人脸认证</button>
                </div>
                
                <!-- 账号密码登录表单 -->
                <div id="pwdForm">
                    <div class="form-group">
                        <label>工号</label>
                        <input class="form-control" placeholder="请输入您的工号" type="text">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input class="form-control" placeholder="请输入您的密码" type="password">
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                        <label>
                            <input type="checkbox"> 记住密码
                        </label>
                        <a href="#" style="color: #3498db;">忘记密码？</a>
                    </div>
                    <button class="btn btn-primary" onclick="login()"
                            style="width: 100%; padding: 12px; font-size: 16px;">登录
                    </button>
                </div>
                
                <!-- 指纹认证区域（默认隐藏） -->
                <div id="fingerForm" style="display: none; text-align: center; padding: 20px 0;">
                    <div style="width: 150px; height: 150px; background-color: #f8f9fa; border: 2px dashed #ddd; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                        <span>指纹采集区</span>
                    </div>
                    <button class="btn btn-primary" style="width: 100%;">开始指纹认证</button>
                </div>
                
                <!-- 人脸认证区域（改造后） -->
                <div id="faceForm" style="display: none; text-align: center; padding: 20px 0;">
                    <div id="video-container">
                        <video id="video" autoplay playsinline></video>
                        <canvas id="canvas"></canvas>
                    </div>
                    <!-- 新增重新检测按钮 -->
                    <button class="btn btn-default" style="width: 100%; margin-bottom: 10px;" onclick="initCamera()">重新检测摄像头</button>
                    <button class="btn btn-primary" style="width: 100%;" onclick="startFaceRecognition()">开始人脸认证</button>
                </div>
            </div>
        </div>
        
        <script>
            // 原有切换认证方式逻辑保留
            document.getElementById('pwdAuth').addEventListener('click', function () {
                switchAuth('pwd');
            });
            document.getElementById('fingerAuth').addEventListener('click', function () {
                switchAuth('finger');
            });
            document.getElementById('faceAuth').addEventListener('click', function () {
                switchAuth('face');
                // 切换到人脸认证时自动启动摄像头
                initCamera();
            });

            function switchAuth(type) {
                document.querySelectorAll('.auth-type button').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.getElementById('pwdForm').style.display = 'none';
                document.getElementById('fingerForm').style.display = 'none';
                document.getElementById('faceForm').style.display = 'none';

                // 新增：切换非人脸认证时，强制释放摄像头
                if (type !== 'face' && stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                    video.srcObject = null; // 清空视频源
                }

                if (type === 'pwd') {
                    document.getElementById('pwdAuth').classList.add('active');
                    document.getElementById('pwdForm').style.display = 'block';
                } else if (type === 'finger') {
                    document.getElementById('fingerAuth').classList.add('active');
                    document.getElementById('fingerForm').style.display = 'block';
                } else if (type === 'face') {
                    document.getElementById('faceAuth').classList.add('active');
                    document.getElementById('faceForm').style.display = 'block';
                    initCamera(); // 仅在切换到人脸时初始化
                }
            }

            // 原有账号密码登录逻辑保留
            function login() {
                const userId = document.querySelector('#pwdForm input[type="text"]').value;
                const password = document.querySelector('#pwdForm input[type="password"]').value;

                if (!userId) {
                    alert('请输入工号');
                    return;
                }
                if (!password) {
                    alert('请输入密码');
                    return;
                }

                fetch('http://localhost:3030/login/pwd', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({userId, password})
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.code === 200) {
                            alert('登陆成功，即将进入系统...');
                            var userRole = data.data.userRole;
                            if (userRole === 0) {
                                window.location.href = 'admin/admin_index.html';
                            } else {
                                window.location.href = 'employee/employee_index.html';
                            }
                        } else {
                            alert('登录失败，原因：' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('登录请求失败：', error);
                        alert('网络异常，请重试');
                    });
            }

            // 原有指纹认证逻辑保留
            function fingerLogin() {
                const fingerprint = 'finger_' + new Date().getTime();
                fetch('http://localhost:3030/login/finger', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: 'fingerprint=' + fingerprint
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.code === 200) {
                            alert(data.msg + '，即将进入系统...');
                            window.location.href = 'employee/employee_index.html';
                        } else {
                            alert(data.msg);
                        }
                    })
                    .catch(error => {
                        console.error('指纹认证失败：', error);
                        alert('网络异常，请重试');
                    });
            }

            // ===================== 新增人脸认证核心逻辑 =====================
            let stream = null; // 摄像头流
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // 初始化摄像头
            function initCamera() {
                // 1. 强制释放所有已有流（包括跨函数的流）
                if (stream) {
                    stream.getTracks().forEach(track => {
                        track.stop();
                        track = null; // 彻底清空引用
                    });
                    stream = null;
                }

                // 2. 延迟请求（延长至500ms，给硬件释放时间）
                setTimeout(() => {
                    // 3. 兼容不同浏览器的媒体设备API
                    navigator.mediaDevices = navigator.mediaDevices || ((navigator.mozGetUserMedia || navigator.webkitGetUserMedia) ? {
                        getUserMedia: function (c) {
                            return new Promise(function (y, n) {
                                (navigator.mozGetUserMedia ||
                                    navigator.webkitGetUserMedia).call(navigator, c, y, n);
                            });
                        }
                    } : null);

                    if (!navigator.mediaDevices) {
                        alert('当前浏览器不支持摄像头调用，请使用Chrome/Firefox最新版！');
                        return;
                    }

                    // 4. 降低分辨率要求，增加兼容性（避免硬件不支持指定分辨率）
                    navigator.mediaDevices.getUserMedia({
                        video: {
                            width: {ideal: 300, max: 640},
                            height: {ideal: 200, max: 480},
                            facingMode: 'user' // 强制使用前置摄像头（移动端/笔记本）
                        },
                        audio: false
                    }).then(mediaStream => {
                        stream = mediaStream;
                        video.srcObject = stream;
                        // 监听视频播放就绪事件
                        video.onloadedmetadata = function () {
                            video.play().catch(err => console.warn('视频自动播放失败：', err));
                        };
                    }).catch(err => {
                        console.error('摄像头初始化失败详情：', err);
                        // 分类提示错误原因，方便排查
                        if (err.name === 'NotAllowedError') {
                            alert('摄像头权限被拒绝！请在浏览器地址栏左侧点击摄像头图标，允许本网站使用摄像头。');
                        } else if (err.name === 'NotFoundError') {
                            alert('未检测到摄像头设备！请检查摄像头是否连接或被其他程序占用。');
                        } else if (err.name === 'NotReadableError') {
                            alert('摄像头被占用！请关闭微信、钉钉、其他浏览器标签页等占用摄像头的程序后重试。');
                        } else {
                            alert('摄像头初始化失败：' + err.message + '\n错误类型：' + err.name);
                        }
                    });
                }, 500);
            }

            // 采集人脸帧并发送到后端识别
            function startFaceRecognition() {
                // 绘制视频帧到canvas
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // 将canvas转换为Base64格式（JPEG）
                const faceImageBase64 = canvas.toDataURL('image/jpeg', 0.8)
                    .replace('data:image/jpeg;base64,', ''); // 去除base64前缀

                // 发送到后端SpringBoot接口
                fetch('http://localhost:3030/login/face', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({faceImageBase64: faceImageBase64})
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.code === 200) {
                            alert('人脸认证成功：' + data.data.userName + '，即将进入系统...');
                            // 根据用户角色跳转
                            if (data.data.userRole === 0) {
                                window.location.href = 'admin/admin_index.html';
                            } else {
                                window.location.href = 'employee/employee_index.html';
                            }
                        } else {
                            alert('人脸认证失败：' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error('人脸认证请求失败：', error);
                        alert('网络异常，请重试');
                    });
            }

            // 页面卸载时关闭摄像头
            window.onbeforeunload = function () {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            };

            // 绑定事件
            window.onload = function () {
                document.querySelector('#fingerForm .btn').onclick = fingerLogin;
            }
        </script>
    </body>
</html>
