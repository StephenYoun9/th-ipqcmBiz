<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能工具柜 - 登录</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-title">智能工具柜管理系统</div>

        <div class="auth-type">
            <button class="active" id="pwdAuth">账号密码</button>
            <button id="fingerAuth">指纹认证</button>
            <button id="faceAuth">人脸认证</button>
        </div>

        <div id="pwdForm">
            <div class="form-group">
                <label>工号</label>
                <input class="form-control" id="loginUserId" placeholder="请输入您的工号" type="text">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input class="form-control" id="loginPassword" placeholder="请输入您的密码" type="password">
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <label><input type="checkbox" id="rememberMe"> 记住密码</label>
                <a href="javascript:void(0)" onclick="showForgotPassword()" style="color: #3498db;">忘记密码？</a>
            </div>
            <button class="btn btn-primary" onclick="login()" style="width: 100%; padding: 12px; font-size: 16px;">登录</button>
        </div>

        <div id="fingerForm" style="display: none; text-align: center; padding: 20px 0;">
            <div style="width: 150px; height: 150px; background-color: #f8f9fa; border: 2px dashed #ddd; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                <span>指纹采集区</span>
            </div>
            <button class="btn btn-primary" style="width: 100%;">开始指纹认证</button>
        </div>

        <div id="faceForm" style="display: none; text-align: center; padding: 20px 0;">
            <div id="video-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                <div id="face-status-overlay" style="display: none;">
                    <div class="status-text" id="face-status-text">正在识别...</div>
                    <div class="loading-spinner"></div>
                </div>
            </div>
            <select id="cameraSelect" class="form-control" style="display: none; margin-bottom: 10px;">
                <option value="">选择摄像头...</option>
            </select>
            <div id="face-status-msg" class="face-status-msg"></div>
            <button class="btn btn-default" style="width: 100%; margin-bottom: 10px;" onclick="detectCameras()">重新检测摄像头</button>
            <button id="face-login-btn" class="btn btn-primary" style="width: 100%;" onclick="startFaceRecognition()">开始人脸认证</button>
        </div>
    </div>
</div>

<div id="success-modal" class="success-modal" style="display: none;">
    <div class="success-modal-content">
        <div class="success-icon">&#10004;</div>
        <div class="success-title">认证成功</div>
        <div class="success-user-info">
            <div class="success-label">登录人员</div>
            <div class="success-username" id="success-user-name">-</div>
        </div>
        <div class="success-role" id="success-user-role">-</div>
        <div class="success-hint">正在进入系统，请稍候...</div>
        <div class="success-progress">
            <div class="success-progress-bar"></div>
        </div>
    </div>
</div>

<div id="forgot-modal" class="success-modal" style="display: none;">
    <div class="success-modal-content" style="min-width: 350px;">
        <div class="success-title">忘记密码</div>
        <div style="text-align: center; padding: 20px 0;">
            <p style="color: #666; margin-bottom: 20px;">请联系管理员重置密码</p>
            <p style="color: #999; font-size: 14px;">或联系IT部门进行处理</p>
        </div>
        <div style="text-align: center;">
            <button class="btn btn-primary" onclick="closeForgotModal()" style="width: 100%;">我知道了</button>
        </div>
    </div>
</div>
<script src="js/constants.js"></script>
<script src="js/index.js"></script>
</body>
</html>
