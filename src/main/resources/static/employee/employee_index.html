<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能工具柜 - 员工借还主界面</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="css/employee_index.css">
</head>
<body>
<div class="header">
    <div class="logo">智能工具柜管理系统</div>
    <div class="user-info">
        <span>当前登录：张三（工号：001）</span>
        <a href="javascript:void(0)" class="btn btn-danger" onclick="logout()">退出登录</a>
    </div>
</div>

<div class="card">
    <h2>工具借还</h2>
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <button class="btn btn-primary" style="padding: 20px 40px; font-size: 16px;" onclick="window.location.href='../tool/borrow_tool.html'">借工具</button>
        <button class="btn btn-success" style="padding: 20px 40px; font-size: 16px;" onclick="window.location.href='../tool/return_tool.html'">还工具</button>
    </div>
</div>

<div class="card">
    <h2>最近借还记录</h2>
    <table class="table">
        <thead>
        <tr>
            <th>工具编号</th>
            <th>工具名称</th>
            <th>柜号</th>
            <th>借出时间</th>
            <th>归还时间</th>
            <th>状态</th>
        </tr>
        </thead>
        <tbody id="borrowTableBody">
        <tr><td colspan="6" style="text-align: center;">加载中...</td></tr>
        </tbody>
    </table>
    <div id="borrowPagination" style="margin-top: 15px; text-align: center;"></div>
</div>

<div class="card">
    <h2>系统公告</h2>
    <div id="announcementContainer">
        <div class="alert alert-info">加载中...</div>
    </div>
</div>

<!-- 图片预览弹窗 -->
<div class="modal" id="imagePreviewModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); cursor: pointer;" onclick="closeImagePreview()">
    <span style="position: absolute; right: 20px; top: 10px; color: white; font-size: 40px; cursor: pointer;">&times;</span>
    <img id="previewImage" style="max-width: 90%; max-height: 90%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
</div>
<script src="../js/constants.js"></script>
<script src="../js/auth.js"></script>
<script src="js/employee_index.js"></script>
<script>
if (!initPageAuth(SESSION_TIMEOUT)) {
    // Already redirected to login
} else {
    const userInfo = getUserInfo();
    if (userInfo) {
        const spanEl = document.querySelector('.user-info span');
        if (spanEl) {
            spanEl.textContent = '当前登录：' + (userInfo.userName || '未知') + '（工号：' + (userInfo.userId || '') + '）';
        }
    }
}
</script>
</body>
</html>
