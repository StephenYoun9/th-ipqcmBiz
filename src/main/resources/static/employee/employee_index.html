<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能工具柜 - 员工借还主界面</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<!-- 顶部导航 -->
<div class="header">
    <div class="logo">智能工具柜管理系统</div>
    <div class="user-info">
        <span>当前登录：张三（工号：001）</span>
        <a href="../index.html">退出登录</a>
    </div>
</div>

<!-- 核心操作区 -->
<div class="card">
    <h2>工具借还</h2>
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <button class="btn btn-primary" style="padding: 20px 40px; font-size: 16px;" onclick="window.location.href='../tool/borrow_tool.html'">借工具</button>
        <button class="btn btn-success" style="padding: 20px 40px; font-size: 16px;" onclick="window.location.href='../tool/return_tool.html'">还工具</button>
    </div>
</div>

<!-- 最近借还记录 -->
<div class="card">
    <h2>最近借还记录</h2>
    <table class="table">
        <thead>
        <tr>
            <th>工具名称</th>
            <th>操作时间</th>
            <th>状态</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>扳手（W001）</td>
            <td>2026-03-05 09:30</td>
            <td>已借出</td>
        </tr>
        <tr>
            <td>螺丝刀（S002）</td>
            <td>2026-03-04 14:20</td>
            <td>已归还</td>
        </tr>
        <tr>
            <td>老虎钳（L003）</td>
            <td>2026-03-03 10:15</td>
            <td>已归还</td>
        </tr>
        </tbody>
    </table>
    <div style="margin-top: 10px;">
        <a href="personal_center.html" style="color: #3498db;">查看全部记录 →</a>
    </div>
</div>

<!-- 系统公告 -->
<div class="card">
    <h2>系统公告</h2>
    <div class="alert alert-info">
        温馨提示：今日14:00-15:00系统将进行维护，期间暂停工具借还服务，敬请谅解！
    </div>
</div>
</body>
</html>
