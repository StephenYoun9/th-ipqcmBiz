<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>智能工具柜 - 还工具</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="css/return_tool.css">
</head>
<body>
<div class="header">
  <div class="logo">智能工具柜管理系统</div>
  <div class="user-info">
    <a href="../employee/employee_index.html" class="btn btn-default">返回主界面</a>
     <a class="btn btn-danger" href="javascript:void(0)" onclick="logout()">退出登录</a>
     <span>当前登录：张三（工号：001）</span>
  </div>
</div>

<div class="card">
  <h2>还工具</h2>
  <div class="alert alert-info">
    请确认要归还的工具，点击"确认归还"后归还柜门将开启，请放入对应工具！
  </div>

  <h3>当前未归还工具</h3>
  <table class="table">
    <thead>
    <tr>
      <th>选择</th>
      <th>工具名称</th>
      <th>工具编号</th>
      <th>借出时间</th>
      <th>存放位置</th>
    </tr>
    </thead>
    <tbody>
    <tr>
      <td><input type="radio" name="returnTool" value="W001" checked></td>
      <td>扳手</td>
      <td>W001</td>
      <td>2026-03-05 09:30</td>
      <td>A01柜（归还至原位置）</td>
    </tr>
    </tbody>
  </table>

  <div style="margin-top: 15px;">
    <button class="btn btn-success" id="returnBtn">确认归还</button>
  </div>
</div>

<div class="card">
  <h3>归还进度提示</h3>
  <div class="alert alert-info" id="returnTips">
    等待确认归还操作...
  </div>
</div>
<script src="../js/constants.js"></script>
<script src="../js/auth.js"></script>
<script src="js/return_tool.js"></script>
<script>
if (!initPageAuth(SESSION_TIMEOUT)) {
    // Already redirected to login
} else {
    const userInfo = getUserInfo();
    if (userInfo) {
        const spanEl = document.querySelector('.user-info span');
        if (spanEl) {
            spanEl.textContent = '当前登录：' + (userInfo.userName || '未知') + '（工号：' + (userInfo.userId || '') + '）';
        }
    }
}
</script>
</body>
</html>
