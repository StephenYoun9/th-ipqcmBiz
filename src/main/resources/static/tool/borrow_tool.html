<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>智能工具柜 - 借工具</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="css/borrow_tool.css">
</head>
<body>
<div class="header">
  <div class="logo">智能工具柜管理系统</div>
  <div class="user-info">
    <a href="../employee/employee_index.html" class="btn btn-default">返回主界面</a>
     <a class="btn btn-danger" href="javascript:void(0)" onclick="logout()">退出登录</a>
     <span></span>
  </div>
</div>

<div class="card">
  <h2>借工具</h2>
  <div style="display: flex; gap: 10px; margin-top: 10px;">
    <div class="form-group" style="flex: 1;">
      <input type="text" class="form-control" id="searchKeyword" placeholder="按工具名称/编号搜索">
    </div>
    <div class="form-group" style="width: 150px;">
      <select class="form-control" id="searchToolType">
        <option value="">全部类型</option>
        <option value="hand">手动工具</option>
        <option value="electric">电动工具</option>
        <option value="measuring">测量工具</option>
      </select>
    </div>
    <button class="btn btn-primary" style="height: 38px; margin-top: 24px;" onclick="searchTools()">查询</button>
  </div>
</div>

<div class="card">
  <h3>可借工具列表</h3>
  <table class="table">
    <thead>
    <tr>
      <th>选择</th>
      <th>工具名称</th>
      <th>工具编号</th>
      <th>存放位置</th>
      <th>工具类型</th>
    </tr>
    </thead>
    <tbody id="toolTableBody">
    <tr><td colspan="5" style="text-align: center;">加载中...</td></tr>
    </tbody>
  </table>
  <div id="paginationContainer" style="margin-top: 15px; text-align: center;"></div>
  <div style="margin-top: 15px;">
    <button class="btn btn-primary" id="borrowBtn" onclick="confirmBorrow()" disabled>确认借取</button>
  </div>
</div>

<div class="card">
  <h3>操作提示</h3>
  <div class="alert alert-info" id="tips">
    请选择要借取的工具，确认后对应柜门将自动开启，请在3分钟内取出工具！
  </div>
</div>
<script src="../js/constants.js"></script>
<script src="../js/auth.js"></script>
<script src="js/borrow_tool.js"></script>
<script>
if (!initPageAuth(SESSION_TIMEOUT)) {
    // Already redirected to login
} else {
    const userInfo = getUserInfo();
    if (userInfo) {
        const spanEl = document.querySelector('.user-info span');
        if (spanEl) {
            spanEl.textContent = '当前登录：' + (userInfo.userName || '未知') + '（工号：' + (userInfo.userId || '') + '）';
        }
    }
}
</script>
</body>
</html>
